name: Nattivus CI

on:
  push:
    paths:
      - 'nattivus/**'
      - '.github/workflows/nattivus-ci.yml'
  pull_request:
    paths:
      - 'nattivus/**'
      - '.github/workflows/nattivus-ci.yml'

defaults:
  run:
    working-directory: nattivus

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: nattivus/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeCheck
        run: yarn nx run-many --target=typecheck --all

      - name: Lint
        run: yarn nx run-many --target=lint --all

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nattivus
          POSTGRES_PASSWORD: nattivus
          POSTGRES_DB: nattivus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nattivus:nattivus@localhost:5432/nattivus_test
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY: ${{ secrets.NATTIVUS_JWT_PRIVATE_KEY || 'ci-placeholder-key' }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: nattivus/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run DB migrations
        run: yarn db:init

      - name: Run all tests
        run: yarn nx run-many --target=test --all
